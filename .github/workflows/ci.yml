name: CI

# Runs on every push to main and every PR. CD (deploy to AWS) comes in Phase 5.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: CI only needs to read the code

jobs:
  api:
    name: API — typecheck, lint, test + coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    # `services:` = Docker containers GitHub starts next to the job, like a mini
    # docker-compose. Our integration tests hit a REAL Postgres, not a mock.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_media_studio_test
        ports:
          - 5432:5432
        # Job steps wait until this passes, so tests never race a booting DB.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Phase 2: the generation tests use a REAL queue and REAL S3-compatible storage too.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_media_studio_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_media_studio_test
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # S3-compatible storage for the tests. Started with `docker run` (not `services:`) because
      # `services:` can't pass a container command, and Silo needs `server /data`.
      - name: Start Silo (S3-compatible storage)
        run: |
          docker run -d --name silo -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs silo; exit 1
      - run: npm ci                 # clean, lockfile-exact install (also runs prisma generate)
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      # global-setup runs `prisma migrate deploy` first; fails if coverage < thresholds
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### API test coverage", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  web:
    name: Web — typecheck, lint, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Bundle size budget
        run: |
          npm run --silent size | tee size.txt
          { echo '### Web bundle'; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
