name: CI

# Runs on every push to main and every PR. A green run on main triggers deploy.yml (Phase 5).
on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: CI only needs to read the code

jobs:
  api:
    name: API — typecheck, lint, test + coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api

    # `services:` = Docker containers GitHub starts next to the job, like a mini
    # docker-compose. Our integration tests hit a REAL Postgres, not a mock.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_media_studio_test
        ports:
          - 5432:5432
        # Job steps wait until this passes, so tests never race a booting DB.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Phase 2: the generation tests use a REAL queue and REAL S3-compatible storage too.
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_media_studio_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_media_studio_test
      TEST_REDIS_URL: redis://localhost:6379/1
      TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # S3-compatible storage for the tests. Started with `docker run` (not `services:`) because
      # `services:` can't pass a container command, and Silo needs `server /data`.
      - name: Start Silo (S3-compatible storage)
        run: |
          docker run -d --name silo -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs silo; exit 1
      - run: npm ci                 # clean, lockfile-exact install (also runs prisma generate)
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      # global-setup runs `prisma migrate deploy` first; fails if coverage < thresholds
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### API test coverage", "| Metric | % | Covered |", "|---|---|---|",
              ...["lines","statements","functions","branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  web:
    name: Web — typecheck, lint, build, bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Bundle size budget
        run: |
          npm run --silent size | tee size.txt
          { echo '### Web bundle'; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Phase 4: build the real images and run the whole stack exactly like `docker compose up`.
  # No push yet (that's CD, Phase 5): this proves the images build and the containers work together.
  docker:
    name: Docker — build images + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # buildx = BuildKit builder: needed for cache mounts and the GitHub Actions layer cache.
      - uses: docker/setup-buildx-action@v3
      # Build each image once with a persistent layer cache (type=gha), load it into the local
      # Docker daemon, then compose reuses it instead of rebuilding.
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: api
          tags: ai-media-studio-api:local
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: api
          target: migrator
          tags: ai-media-studio-migrator:local
          load: true
          cache-from: type=gha,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: web
          tags: ai-media-studio-web:local
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      # Fail on HIGH/CRITICAL vulnerabilities that have a fix available (unfixed ones can't be
      # acted on and would just make the gate flaky). The migrator is a one-off task that never
      # takes traffic, so it's scanned too but only reported.
      - name: Vulnerability scan (api image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-media-studio-api:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Vulnerability scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ai-media-studio-web:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
      - name: Image sizes
        run: |
          { echo '### Docker images'; echo '| Image | Size |'; echo '|---|---|';
            docker images --format '| {{.Repository}}:{{.Tag}} | {{.Size}} |' | grep ai-media-studio; } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the full stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Smoke test (register -> generate -> worker -> image)
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Phase 5: the Terraform must be well-formed and pass a static security scan before it can merge.
  # No AWS credentials here: validate works offline (-backend=false).
  infra:
    name: Infra — terraform fmt/validate + checkov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for d in infra/bootstrap infra/terraform; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: checkov (skips are justified in infra/.checkov.yaml)
        run: |
          pip install --quiet checkov==3.3.29
          checkov -d infra --config-file infra/.checkov.yaml
