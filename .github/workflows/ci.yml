name: CI

# Runs on every push and every PR. CD (deploy to AWS) comes in Phase 5.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: CI only needs to read the code

jobs:
  api:
    name: API — typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # `services:` = Docker containers GitHub starts next to the job, like a mini
    # docker-compose. Our integration tests hit a REAL Postgres, not a mock.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ai_media_studio_test
        ports:
          - 5432:5432
        # Job steps wait until this passes, so tests never race a booting DB.
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_media_studio_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ai_media_studio_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci                 # clean, lockfile-exact install (also runs prisma generate)
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test               # global-setup runs `prisma migrate deploy` on the service DB first
      - run: npm run build

  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
