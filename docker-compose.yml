# Local development infrastructure.
# Phase 0: only the stateful services (postgres, redis, minio).
# api / worker / web containers get added in Phase 4 (Dockerize fully).
#
# Inside this compose network, services reach each other by SERVICE NAME
# (e.g. the api will use host "postgres", not "localhost") — Docker runs an
# internal DNS server that resolves service names to container IPs.

name: ai-media-studio

services:
  postgres:
    image: postgres:16.6-alpine        # pinned version: reproducible builds
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio}
      POSTGRES_DB: ${POSTGRES_DB:-ai_media_studio}
    ports:
      - "5433:5432"                     # host:container — 5432 on the host is taken
    volumes:
      - pgdata:/var/lib/postgresql/data # named volume: data survives `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]  # AOF persistence so queued jobs survive a restart
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local dev (prod uses real AWS S3).
  # NOTE: official minio/minio + minio/mc images were DELETED from Docker Hub
  # (Sept 2026; MinIO community edition is now source-only). We use Silo, the
  # community-maintained MinIO fork: same S3 API, same MINIO_* env vars, same
  # `server /data --console-address` command, bundles the `mc` client.
  # Service keeps the name "minio" because that's the role it plays.
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API (what the AWS SDK talks to)
      - "9001:9001"   # web console — open http://localhost:9001 to browse uploaded files
    volumes:
      - miniodata:/data
    healthcheck:
      # Liveness route kept from MinIO; curl is bundled in the image.
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot helper: creates the assets bucket, then exits.
  # Reuses the same Silo image (it ships `mc`) — one less image to pull.
  minio-init:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-ai-media-assets} &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ai-media-assets}
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
