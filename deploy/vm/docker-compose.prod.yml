# Production override for a single VM (Oracle Cloud Always Free, or any Linux box with Docker).
#
#   docker compose -f docker-compose.yml -f deploy/vm/docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from local:
#  - Caddy is the only thing on the internet (80/443, automatic HTTPS). Nothing else publishes a port.
#  - Every secret comes from .env.prod (generated by deploy/vm/setup.sh); compose refuses to start without them.
#  - No GPU on the server: the Scene Director uses Cloudflare Workers AI (free allocation).
#  - Presigned S3 links point at https://<domain>/<bucket>/..., which Caddy forwards to MinIO.

services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}

  redis:
    ports: !reset []

  minio:
    ports: !reset []
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  api:
    ports: !reset []
    extra_hosts: !reset []
    environment:
      CORS_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
      S3_PUBLIC_ENDPOINT: https://${SITE_DOMAIN}
      DIRECTOR_PROVIDER: ${DIRECTOR_PROVIDER:-cloudflare}
      SIGNUP_BONUS_CREDITS: ${SIGNUP_BONUS_CREDITS:-30}
      GENERATE_RATE_LIMIT: ${GENERATE_RATE_LIMIT:-10}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      DEMO_EMAIL: ${DEMO_EMAIL:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DEMO_DAILY_CREDITS: ${DEMO_DAILY_CREDITS:-100}

  worker:
    extra_hosts: !reset []
    environment:
      S3_PUBLIC_ENDPOINT: https://${SITE_DOMAIN}
      METRICS_TOKEN: ${METRICS_TOKEN}
      DIRECTOR_PROVIDER: ${DIRECTOR_PROVIDER:-cloudflare}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}

  web:
    ports: !reset []

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${SITE_DOMAIN}}
      S3_BUCKET: ${S3_BUCKET:-ai-media-assets}
    volumes:
      - ./deploy/vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddydata:
  caddyconfig:
